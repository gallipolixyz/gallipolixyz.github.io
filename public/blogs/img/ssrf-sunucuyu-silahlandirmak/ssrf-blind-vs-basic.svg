<svg viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="900" height="380" fill="#0d1117"/>

  <!-- Basic SSRF column -->
  <text x="220" y="45" fill="#58a6ff" font-size="22" font-weight="bold" text-anchor="middle">Basic (Görünür) SSRF</text>
  <rect x="60" y="70" width="320" height="90" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="220" y="100" fill="#c9d1d9" font-size="14" text-anchor="middle">İstek gönderilir</text>
  <text x="220" y="125" fill="#c9d1d9" font-size="14" text-anchor="middle">→ yanıt doğrudan sayfada</text>
  <text x="220" y="145" fill="#c9d1d9" font-size="14" text-anchor="middle">saldırgana geri döner</text>

  <rect x="60" y="190" width="320" height="90" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="220" y="220" fill="#8b949e" font-size="13" text-anchor="middle">Örnek: "URL'den önizleme</text>
  <text x="220" y="240" fill="#8b949e" font-size="13" text-anchor="middle">getir" özelliği, gelen HTML'i</text>
  <text x="220" y="260" fill="#8b949e" font-size="13" text-anchor="middle">olduğu gibi ekranda gösterir</text>

  <!-- Blind SSRF column -->
  <text x="680" y="45" fill="#e08a3c" font-size="22" font-weight="bold" text-anchor="middle">Blind (Kör) SSRF</text>
  <rect x="520" y="70" width="320" height="90" rx="8" fill="#161b22" stroke="#e08a3c" stroke-width="1.5"/>
  <text x="680" y="100" fill="#c9d1d9" font-size="14" text-anchor="middle">İstek gönderilir</text>
  <text x="680" y="125" fill="#c9d1d9" font-size="14" text-anchor="middle">→ yanıt saldırgana</text>
  <text x="680" y="145" fill="#c9d1d9" font-size="14" text-anchor="middle">geri dönmez</text>

  <rect x="520" y="190" width="320" height="90" rx="8" fill="#161b22" stroke="#e08a3c" stroke-width="1.5"/>
  <text x="680" y="215" fill="#8b949e" font-size="13" text-anchor="middle">Tespit için zaman farkı</text>
  <text x="680" y="235" fill="#8b949e" font-size="13" text-anchor="middle">(timing) veya kendi sunucuna</text>
  <text x="680" y="255" fill="#8b949e" font-size="13" text-anchor="middle">(OOB) gelen isteğe bakılır</text>

  <line x1="400" y1="150" x2="500" y2="150" stroke="#484f58" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="450" y="330" fill="#8b949e" font-size="13" text-anchor="middle">İki tür de aynı kök nedene dayanır: sunucunun kullanıcı girdisiyle belirlenen bir adrese istek atması</text>
</svg>
