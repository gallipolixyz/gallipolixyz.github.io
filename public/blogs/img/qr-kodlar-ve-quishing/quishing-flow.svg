<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Quishing saldırı akışı</title>
  <desc id="desc">Güvenilir görünen bir QR kodun kullanıcıyı sahte giriş sayfasına yönlendirmesi ve girilen bilgilerin saldırgana ulaşması.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030712"/>
      <stop offset="0.55" stop-color="#071827"/>
      <stop offset="1" stop-color="#041018"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="danger" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#38bdf8" stroke-opacity="0.055"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <circle cx="790" cy="470" r="330" fill="#0891b2" opacity="0.055"/>

  <text x="110" y="118" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="58" font-weight="750">QR kodun arkasında ne var?</text>
  <text x="110" y="176" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27">Quishing, görünmeyen bağlantıyı güvenilir bir hikâyenin içine saklar.</text>

  <!-- Trusted context -->
  <g transform="translate(100 320)">
    <rect width="310" height="310" rx="34" fill="#0d1f32" stroke="#22d3ee" stroke-opacity="0.65" stroke-width="3"/>
    <rect x="55" y="54" width="200" height="134" rx="16" fill="#082f49" stroke="#38bdf8" stroke-width="3"/>
    <path d="M58 72l97 70 97-70M58 178l69-58M252 178l-69-58" fill="none" stroke="#67e8f9" stroke-width="7" stroke-linejoin="round"/>
    <text x="155" y="235" text-anchor="middle" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="700">Güvenilir görünen</text>
    <text x="155" y="274" text-anchor="middle" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22">e-posta / afiş / ödeme</text>
  </g>

  <!-- QR -->
  <g transform="translate(545 330)" filter="url(#glow)">
    <rect width="290" height="290" rx="34" fill="#ecfeff" stroke="url(#accent)" stroke-width="5"/>
    <g fill="#071827">
      <path d="M35 35h75v75H35zm18 18v39h39V53zM180 35h75v75h-75zm18 18v39h39V53zM35 180h75v75H35zm18 18v39h39v-39z" fill-rule="evenodd"/>
      <rect x="132" y="38" width="20" height="20"/><rect x="132" y="70" width="20" height="48"/>
      <rect x="120" y="132" width="34" height="20"/><rect x="166" y="126" width="22" height="22"/>
      <rect x="204" y="126" width="49" height="20"/><rect x="126" y="166" width="20" height="54"/>
      <rect x="158" y="164" width="40" height="20"/><rect x="211" y="164" width="20" height="58"/>
      <rect x="156" y="200" width="36" height="20"/><rect x="126" y="235" width="58" height="20"/>
      <rect x="202" y="235" width="53" height="20"/><rect x="237" y="198" width="18" height="24"/>
    </g>
    <circle cx="250" cy="250" r="38" fill="#be123c" stroke="#ffe4e6" stroke-width="4"/>
    <text x="250" y="264" text-anchor="middle" fill="#fff1f2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="42" font-weight="800">!</text>
  </g>
  <text x="690" y="672" text-anchor="middle" fill="#67e8f9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="750">GİZLENMİŞ URL</text>

  <!-- Fake login -->
  <g transform="translate(970 320)">
    <rect width="520" height="310" rx="34" fill="#211421" stroke="#fb7185" stroke-opacity="0.8" stroke-width="3"/>
    <rect x="44" y="42" width="432" height="48" rx="13" fill="#3f1726"/>
    <circle cx="69" cy="66" r="7" fill="#fb7185"/><circle cx="91" cy="66" r="7" fill="#fbbf24"/>
    <text x="124" y="75" fill="#fecdd3" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18">login-example.com</text>
    <text x="260" y="135" text-anchor="middle" fill="#fff1f2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="700">Hesabını doğrula</text>
    <rect x="92" y="160" width="336" height="42" rx="10" fill="#451a2d" stroke="#9f1239"/>
    <text x="110" y="187" fill="#fda4af" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">e-posta</text>
    <rect x="92" y="216" width="336" height="42" rx="10" fill="#451a2d" stroke="#9f1239"/>
    <text x="110" y="243" fill="#fda4af" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">parola</text>
    <rect x="315" y="272" width="113" height="24" rx="12" fill="url(#danger)"/>
    <text x="371" y="290" text-anchor="middle" fill="#fff7ed" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="750">GÖNDER</text>
  </g>

  <!-- Arrows -->
  <path d="M430 475H510" stroke="#22d3ee" stroke-width="8" stroke-linecap="round"/>
  <path d="M510 455l35 20-35 20z" fill="#22d3ee"/>
  <text x="487" y="435" text-anchor="middle" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">TARA</text>

  <path d="M855 475H930" stroke="#fb7185" stroke-width="8" stroke-linecap="round"/>
  <path d="M930 455l35 20-35 20z" fill="#fb7185"/>
  <text x="910" y="435" text-anchor="middle" fill="#fda4af" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">YÖNLENDİR</text>

  <rect x="397" y="755" width="806" height="62" rx="31" fill="#0f2431" stroke="#155e75"/>
  <text x="800" y="795" text-anchor="middle" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23">Güven kararı QR görüntüsüne değil, açılan alan adına göre verilir.</text>
</svg>
