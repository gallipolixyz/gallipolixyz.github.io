<svg viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="260" fill="#0f172a"/>
  <text x="400" y="32" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Injection (A03) — Basit Saldırı Akışı</text>

  <!-- box 1 -->
  <rect x="30" y="90" width="160" height="70" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="110" y="120" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="13">Kullanıcı</text>
  <text x="110" y="140" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="13">girdi alanı</text>

  <!-- arrow -->
  <line x1="190" y1="125" x2="290" y2="125" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- box 2 -->
  <rect x="300" y="90" width="200" height="70" rx="8" fill="#1e293b" stroke="#f97316" stroke-width="2"/>
  <text x="400" y="118" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="13">Doğrulanmamış girdi</text>
  <text x="400" y="138" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="13">sorguya doğrudan eklenir</text>

  <line x1="500" y1="125" x2="600" y2="125" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- box 3 -->
  <rect x="610" y="90" width="160" height="70" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <text x="690" y="118" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="13">Veritabanı</text>
  <text x="690" y="138" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="13">komutu çalıştırır</text>

  <text x="400" y="210" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12">
    Örn: id=1 OR 1=1 gibi bir girdi, sorgunun mantığını değiştirebilir.
  </text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
