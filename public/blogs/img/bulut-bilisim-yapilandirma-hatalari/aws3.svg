<svg viewBox="0 0 820 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="820" height="460" fill="#ffffff"/>
  <text x="410" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">IAM Yetki Yükseltme: Üç Farklı Sıçrama Tahtası</text>
  <text x="410" y="54" text-anchor="middle" font-size="13" fill="#64748b">Kısıtlı bir kullanıcının Administrator yetkisine ulaşabildiği üç yaygın zincir</text>

  <!-- Başlangıç kutusu -->
  <rect x="345" y="80" width="130" height="46" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <text x="410" y="108" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">Kısıtlı IAM Kullanıcı</text>

  <!-- Üç dal -->
  <line x1="410" y1="126" x2="150" y2="170" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="410" y1="126" x2="410" y2="170" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="410" y1="126" x2="670" y2="170" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Yol 1 -->
  <rect x="50" y="170" width="200" height="72" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.3"/>
  <text x="150" y="194" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c2410c">CreatePolicyVersion</text>
  <text x="150" y="212" text-anchor="middle" font-size="11.5" fill="#334155">Kendi politikasına yeni,</text>
  <text x="150" y="228" text-anchor="middle" font-size="11.5" fill="#334155">sınırsız yetkili versiyon ekler</text>

  <!-- Yol 2 -->
  <rect x="310" y="170" width="200" height="72" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.3"/>
  <text x="410" y="194" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c2410c">PassRole + RunInstances</text>
  <text x="410" y="212" text-anchor="middle" font-size="11.5" fill="#334155">Admin rolünü yeni bir EC2'ya</text>
  <text x="410" y="228" text-anchor="middle" font-size="11.5" fill="#334155">atar, metadata'dan token çalar</text>

  <!-- Yol 3 -->
  <rect x="570" y="170" width="200" height="72" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.3"/>
  <text x="670" y="194" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c2410c">Lambda UpdateFunctionCode</text>
  <text x="670" y="212" text-anchor="middle" font-size="11.5" fill="#334155">Mevcut fonksiyonun kodunu</text>
  <text x="670" y="228" text-anchor="middle" font-size="11.5" fill="#334155">admin yetkili koda çevirir</text>

  <!-- Birleşme ok -->
  <line x1="150" y1="242" x2="410" y2="300" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="410" y1="242" x2="410" y2="300" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="670" y1="242" x2="410" y2="300" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Sonuç kutusu -->
  <rect x="300" y="300" width="220" height="56" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="410" y="325" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">Tam Administrator Yetkisi</text>
  <text x="410" y="344" text-anchor="middle" font-size="11.5" fill="#7f1d1d">Hesabın tamamı ele geçirilir</text>

  <!-- Alt not -->
  <rect x="90" y="385" width="640" height="55" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="410" y="408" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d4ed8">Ortak payda: "Least Privilege" ilkesi</text>
  <text x="410" y="426" text-anchor="middle" font-size="11.5" fill="#334155">Kullanıcıya yalnızca işin gerektirdiği minimum IAM izni verilirse üç yol da kapanır</text>
</svg>
