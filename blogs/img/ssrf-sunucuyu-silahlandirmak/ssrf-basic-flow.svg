<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e74c3c"/>
    </marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2ecc71"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="420" fill="#0d1117"/>

  <!-- Attacker -->
  <rect x="40" y="150" width="180" height="100" rx="10" fill="#21262d" stroke="#e74c3c" stroke-width="2"/>
  <text x="130" y="195" fill="#e74c3c" font-size="20" font-weight="bold" text-anchor="middle">Saldırgan</text>
  <text x="130" y="220" fill="#8b949e" font-size="13" text-anchor="middle">dış ağ / internet</text>

  <!-- Vulnerable server -->
  <rect x="360" y="150" width="200" height="100" rx="10" fill="#21262d" stroke="#f0ad4e" stroke-width="2"/>
  <text x="460" y="185" fill="#f0ad4e" font-size="18" font-weight="bold" text-anchor="middle">Web Sunucusu</text>
  <text x="460" y="208" fill="#8b949e" font-size="13" text-anchor="middle">(URL/isteği filtresiz</text>
  <text x="460" y="225" fill="#8b949e" font-size="13" text-anchor="middle">işleyen zafiyetli uç)</text>

  <!-- Internal service -->
  <rect x="700" y="60" width="180" height="90" rx="10" fill="#21262d" stroke="#2ecc71" stroke-width="2"/>
  <text x="790" y="98" fill="#2ecc71" font-size="16" font-weight="bold" text-anchor="middle">İç Servis</text>
  <text x="790" y="120" fill="#8b949e" font-size="12" text-anchor="middle">(admin panel,</text>
  <text x="790" y="136" fill="#8b949e" font-size="12" text-anchor="middle">iç API)</text>

  <!-- Cloud metadata -->
  <rect x="700" y="260" width="180" height="90" rx="10" fill="#21262d" stroke="#2ecc71" stroke-width="2"/>
  <text x="790" y="298" fill="#2ecc71" font-size="15" font-weight="bold" text-anchor="middle">Cloud Metadata</text>
  <text x="790" y="320" fill="#8b949e" font-size="12" text-anchor="middle">169.254.169.254</text>
  <text x="790" y="336" fill="#8b949e" font-size="12" text-anchor="middle">(IAM credentials)</text>

  <!-- Arrows -->
  <line x1="220" y1="200" x2="355" y2="200" stroke="#e74c3c" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="288" y="188" fill="#e74c3c" font-size="12" text-anchor="middle">url=http://169.254...</text>

  <path d="M560,180 C630,160 660,140 695,115" stroke="#2ecc71" stroke-width="2.5" fill="none" marker-end="url(#arrow2)"/>
  <path d="M560,220 C630,240 660,260 695,285" stroke="#2ecc71" stroke-width="2.5" fill="none" marker-end="url(#arrow2)"/>
  <text x="640" y="105" fill="#2ecc71" font-size="12" text-anchor="middle">sunucu adına istek</text>

  <text x="450" y="380" fill="#8b949e" font-size="13" text-anchor="middle">Sunucu, saldırganın belirttiği adrese kendi güvenilir kimliğiyle istek atar —</text>
  <text x="450" y="400" fill="#8b949e" font-size="13" text-anchor="middle">saldırgan normalde erişemeyeceği iç kaynaklara bu şekilde ulaşır.</text>
</svg>
