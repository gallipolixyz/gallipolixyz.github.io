<svg viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg" font-family="Verdana, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="380" fill="#060a10"/>

  <!-- Robot vacuum body -->
  <g transform="translate(450,220)">
    <ellipse cx="0" cy="0" rx="130" ry="130" fill="#0d141c" stroke="#2DE2E6" stroke-width="3"/>
    <!-- camera eye -->
    <circle cx="0" cy="-20" r="26" fill="#1a0d10" stroke="#FF4D6D" stroke-width="3"/>
    <circle cx="0" cy="-20" r="12" fill="#FF4D6D"/>
    <circle cx="-4" cy="-24" r="3" fill="#FFD1DA"/>
    <!-- body lines -->
    <circle cx="0" cy="0" r="95" fill="none" stroke="#1c2733" stroke-width="1.5"/>
    <rect x="-45" y="35" width="90" height="10" rx="5" fill="#243040"/>
  </g>

  <!-- wifi / bluetooth waves escaping outward -->
  <g stroke="#8fe9ec" fill="none" stroke-width="2" opacity="0.8">
    <path d="M 450 60 A 160 160 0 0 1 610 220" />
    <path d="M 450 30 A 190 190 0 0 1 640 220" opacity="0.5"/>
  </g>
  <g stroke="#FF9DAE" fill="none" stroke-width="2" opacity="0.8">
    <path d="M 450 60 A 160 160 0 0 0 290 220" />
    <path d="M 450 30 A 190 190 0 0 0 260 220" opacity="0.5"/>
  </g>

  <!-- Question mark -->
  <text x="450" y="105" fill="#FFD166" font-size="34" font-weight="bold" text-anchor="middle">?</text>

  <text x="450" y="345" fill="#E8FFFB" font-size="19" font-weight="bold" text-anchor="middle">Sizi İzliyor Olabilir mi?</text>
</svg>
